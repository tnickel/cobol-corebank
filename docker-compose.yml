services:
  postgres:
    image: postgres:16-alpine
    container_name: cobolbank-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cobol
      POSTGRES_PASSWORD: cobol
      POSTGRES_DB: cobolbank
    ports:
      - "5432:5432"
    volumes:
      - cobolbank_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cobol -d cobolbank"]
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  cobolbank_pgdata:
