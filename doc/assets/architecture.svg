    <text x="690" y="318" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">Docker Compose � MVCC</text>
    <text x="690" y="348" text-anchor="middle" fill="#cbd5e1" font-family="Consolas, monospace" font-size="12">accounts  �  transactions</text>
    <text x="690" y="372" text-anchor="middle" fill="#64748b" font-family="Consolas, monospace" font-size="11">cobol@localhost:5432/cobolbank</text>
