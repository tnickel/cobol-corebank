    <text x="370" y="168" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11">/simulator/ � N Clients</text>
  </g>

  <!-- arrows down -->
  <path d="M140 194 L140 230" stroke="url(#acc)" stroke-width="2" fill="none"/>
  <path d="M370 194 L370 230" stroke="url(#acc)" stroke-width="2" fill="none"/>
  <path d="M140 230 L370 230 L255 230 L255 250" stroke="url(#acc)" stroke-width="2" fill="none"/>

