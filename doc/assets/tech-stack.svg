<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-label="COBOL CoreBank Tech Stack">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07101f"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cobol" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e7490"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="s" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="960" height="520" rx="28" fill="url(#bg)"/>
  <rect x="28" y="28" width="904" height="464" rx="22" fill="url(#glow)" stroke="#22d3ee33"/>

  <text x="56" y="78" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="800">Tech Stack</text>
  <text x="56" y="106" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="14">Core Banking Demo  Geschäftslogik in COBOL, Betrieb modern</text>

  <!-- COBOL hero card -->
  <g filter="url(#s)">
    <rect x="56" y="140" width="848" height="150" rx="20" fill="#0b1628" stroke="#22d3ee88" stroke-width="2"/>
    <rect x="56" y="140" width="12" height="150" rx="6" fill="url(#cobol)"/>
    <text x="90" y="178" fill="#67e8f9" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="0.12em">CORE ENGINE</text>
    <text x="90" y="218" fill="#ecfeff" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="800">COBOL</text>
    <text x="250" y="218" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">GnuCOBOL 3.2 + GixSQL Embedded SQL</text>
    <text x="90" y="252" fill="#cbd5e1" font-family="Consolas, monospace" font-size="13">cobol_bank.sqb  ’  EXEC SQL  ’  cobol_bank.exe  ’  PostgreSQL</text>
    <text x="90" y="274" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="12">Transfers · Deposits · Zinslauf · LIST_ACCOUNTS · JSON über STDOUT</text>
  </g>

  <!-- Stack row -->
  <g filter="url(#s)">
    <rect x="56" y="320" width="200" height="120" rx="16" fill="#15203b" stroke="#a78bfa55"/>
    <text x="156" y="358" text-anchor="middle" fill="#c4b5fd" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">UI</text>
    <text x="156" y="386" text-anchor="middle" fill="#f1f5f9" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">Vanilla Web</text>
    <text x="156" y="410" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11">Admin + Simulator</text>
  </g>
  <g filter="url(#s)">
    <rect x="272" y="320" width="200" height="120" rx="16" fill="#15203b" stroke="#38bdf855"/>
    <text x="372" y="358" text-anchor="middle" fill="#7dd3fc" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">BRIDGE</text>
    <text x="372" y="386" text-anchor="middle" fill="#f1f5f9" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">Node.js</text>
    <text x="372" y="410" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11">Queue · Metrics · HTTP</text>
  </g>
  <g filter="url(#s)">
    <rect x="488" y="320" width="200" height="120" rx="16" fill="#0f2740" stroke="#22d3ee88" stroke-width="2"/>
    <text x="588" y="358" text-anchor="middle" fill="#67e8f9" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">ENGINE </text>
    <text x="588" y="386" text-anchor="middle" fill="#ecfeff" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">GnuCOBOL</text>
    <text x="588" y="410" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11">GixSQL · ACID SQL</text>
  </g>
  <g filter="url(#s)">
    <rect x="704" y="320" width="200" height="120" rx="16" fill="#15203b" stroke="#33679188"/>
    <text x="804" y="358" text-anchor="middle" fill="#93c5fd" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">DATA</text>
    <text x="804" y="386" text-anchor="middle" fill="#f1f5f9" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">PostgreSQL 16</text>
    <text x="804" y="410" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11">MVCC · Docker</text>
  </g>
</svg>
